<?xml version="1.0" encoding="utf-8"?>
<!-- Situational layout of the kf_1x1x1_1d_dog_position sample, top view:
     1 m = 30 px, x = 60 + 30 distance. -->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Hallway Layout</title>
  <rect x="0" y="0" width="720" height="490" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-weight="bold" font-size="16">Sample 1x1x1 Dog Position</text>
  <text x="360" y="52" text-anchor="middle">Situational Layout, Top View</text>

  <!-- The hallway. -->
  <rect x="60" y="110" width="620" height="220" fill="#f4f1ea"/>
  <path d="M680,110 L60,110 L60,330 L680,330" fill="none" stroke="#555555" stroke-width="4"/>
  <text x="370" y="102" text-anchor="middle" font-size="12" fill="#444444">Hallway, top view</text>
  <text x="70" y="352" font-size="12" fill="#444444">Left end</text>

  <!-- The distance from the left end of the hallway. -->
  <line x1="60" y1="390" x2="660" y2="390" stroke="#444444" stroke-width="1.5"/>
  <line x1="60" y1="390" x2="60" y2="400" stroke="#444444" stroke-width="1.5"/>
  <text x="60" y="416" text-anchor="middle" font-size="12" fill="#444444">0 m</text>
  <line x1="90" y1="390" x2="90" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="120" y1="390" x2="120" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="150" y1="390" x2="150" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="180" y1="390" x2="180" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="210" y1="390" x2="210" y2="400" stroke="#444444" stroke-width="1.5"/>
  <text x="210" y="416" text-anchor="middle" font-size="12" fill="#444444">5 m</text>
  <line x1="240" y1="390" x2="240" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="270" y1="390" x2="270" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="300" y1="390" x2="300" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="330" y1="390" x2="330" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="360" y1="390" x2="360" y2="400" stroke="#444444" stroke-width="1.5"/>
  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#444444">10 m</text>
  <line x1="390" y1="390" x2="390" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="420" y1="390" x2="420" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="450" y1="390" x2="450" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="480" y1="390" x2="480" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="510" y1="390" x2="510" y2="400" stroke="#444444" stroke-width="1.5"/>
  <text x="510" y="416" text-anchor="middle" font-size="12" fill="#444444">15 m</text>
  <line x1="540" y1="390" x2="540" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="570" y1="390" x2="570" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="600" y1="390" x2="600" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="630" y1="390" x2="630" y2="395" stroke="#444444" stroke-width="1.5"/>
  <line x1="660" y1="390" x2="660" y2="400" stroke="#444444" stroke-width="1.5"/>
  <text x="660" y="416" text-anchor="middle" font-size="12" fill="#444444">20 m</text>
  <text x="370" y="440" text-anchor="middle" font-size="12" fill="#444444">Distance from the left end of the hallway</text>

  <!-- The distance measured by the RFID tracker. -->
  <line x1="64" y1="255" x2="474.8" y2="255" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="481.6,255 472.6,259 472.6,251" fill="#9a9a9a"/>
  <text x="260" y="245" text-anchor="middle" fill="#1f6fb2" font-weight="bold">RFID tracker</text>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#666666">the measured distance z from the left end</text>

  <!-- The measured distances of the dog. -->
  <polygon points="100.6,388 95.6,378 105.6,378" fill="#d9661f"/>
  <polygon points="116.5,388 111.5,378 121.5,378" fill="#d9661f"/>
  <polygon points="190.2,388 185.2,378 195.2,378" fill="#d9661f"/>
  <polygon points="274.7,388 269.7,378 279.7,378" fill="#d9661f"/>
  <polygon points="268.2,388 263.2,378 273.2,378" fill="#d9661f"/>
  <polygon points="265.3,388 260.3,378 270.3,378" fill="#d9661f"/>
  <polygon points="355.4,388 350.4,378 360.4,378" fill="#d9661f"/>
  <polygon points="436.6,388 431.6,378 441.6,378" fill="#d9661f"/>
  <polygon points="548.2,388 543.2,378 553.2,378" fill="#d9661f"/>
  <polygon points="504,388 499,378 509,378" fill="#d9661f"/>
  <text x="66" y="372" font-size="12" fill="#a8460c">RFID readings z1 to z10: 1.35 m to 16.27 m, R = 2 m²</text>

  <!-- The dog moving along the hallway. -->
  <ellipse cx="505.6" cy="255" rx="22" ry="11" fill="#8a5a2b"/>
  <circle cx="529.6" cy="252" r="9" fill="#8a5a2b"/>
  <path d="M483.6,252 l-10,-8" stroke="#8a5a2b" stroke-width="3" fill="none"/>
  <line x1="511.6" y1="268" x2="511.6" y2="388" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="511.6" y="222" text-anchor="middle" fill="#1f6fb2" font-weight="bold">Dog</text>
  <text x="511.6" y="300" text-anchor="middle" font-size="12" fill="#1f6fb2">Estimate after ten</text>
  <text x="511.6" y="315" text-anchor="middle" font-size="12" fill="#1f6fb2">steps: 15.05 m</text>
  <line x1="543.6" y1="236" x2="594.8" y2="236" stroke="#2f7d32" stroke-width="3"/>
  <polygon points="603.6,236 592.6,241 592.6,231" fill="#2f7d32"/>
  <text x="547.6" y="200" font-size="12" fill="#2f7d32">1 m per step:</text>
  <text x="547.6" y="215" font-size="12" fill="#2f7d32">u = 1 m, Q = 1 m²</text>

  <!-- The initial position of the dog. -->
  <circle cx="60" cy="390" r="5" fill="#1f6fb2"/>
  <text x="60" y="470" font-size="12" fill="#1f6fb2">Start: 0 m, the initial estimate</text>
</svg>
