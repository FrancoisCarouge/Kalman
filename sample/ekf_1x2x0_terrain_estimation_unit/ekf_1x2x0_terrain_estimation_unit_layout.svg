<?xml version="1.0" encoding="utf-8"?>
<!-- Situational layout of the ekf_1x2x0_terrain_estimation_unit sample, side view:
     1 m north = 1.667 px, x = 60 + 1.667 north; 1 m of altitude = 12 px,
     y = 560 - 12 altitude, the vertical scale and the tilt exaggerated. -->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Terrain Layout</title>
  <rect x="0" y="0" width="720" height="640" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-weight="bold" font-size="16">Sample 1x2x0 Terrain Estimation</text>
  <text x="360" y="52" text-anchor="middle">Situational Layout, Side View</text>

  <!-- North and up axes. -->
  <line x1="40" y1="140" x2="40" y2="88.8" stroke="#2f7d32" stroke-width="3"/>
  <polygon points="40,80 35,91 45,91" fill="#2f7d32"/>
  <line x1="40" y1="140" x2="91.2" y2="140" stroke="#2f7d32" stroke-width="3"/>
  <polygon points="100,140 89,135 89,145" fill="#2f7d32"/>
  <text x="40" y="72" text-anchor="middle" fill="#2f7d32" font-weight="bold">Up</text>
  <text x="106" y="145" fill="#2f7d32" font-weight="bold">North</text>

  <!-- The rising terrain, and the altitude of the take-off point. -->
  <polygon points="20,544.6 700,397.8 700,610 20,610" fill="#ece4d4"/>
  <line x1="20" y1="544.6" x2="700" y2="397.8" stroke="#8a6d3b" stroke-width="2.5"/>
  <line x1="20" y1="560" x2="700" y2="560" stroke="#8a6d3b" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="26" y="578" font-size="12" fill="#6b5428">Altitude 0 m: the take-off point</text>
  <text x="330" y="500" font-size="12" fill="#6b5428" transform="rotate(-12.2 330 500)">Terrain altitude X: 2 m, rising 3 % north</text>

  <!-- The flight path and the range finder dropout. -->
  <line x1="20" y1="200" x2="700" y2="200" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="260" y1="200" x2="460" y2="200" stroke="#c0392b" stroke-width="5" stroke-opacity="0.45"/>
  <text x="360" y="186" text-anchor="middle" font-size="12" fill="#c0392b">Range finder dropout, 20 s to 40 s: the flow alone</text>

  <!-- The height above ground. -->
  <line x1="118" y1="208" x2="118" y2="516" stroke="#444444" stroke-width="1.5"/>
  <polygon points="118,200 113.5,210 122.5,210" fill="#444444"/>
  <polygon points="118,524 113.5,514 122.5,514" fill="#444444"/>
  <text x="112" y="370" text-anchor="end" fill="#444444">h</text>

  <!-- The optical flow field of view and the apparent motion of the ground. -->
  <polygon points="160,212 171,512 215,502.5" fill="#d9661f" fill-opacity="0.18"/>
  <g stroke="#d9661f" stroke-width="1.5">
    <line x1="212" y1="497" x2="186" y2="502.6"/>
    <line x1="196" y1="492" x2="176" y2="496.3"/>
  </g>
  <polygon points="180,504 189,498.6 190,505.4" fill="#d9661f"/>
  <polygon points="170,497.6 179,492.2 180,499" fill="#d9661f"/>

  <!-- The range finder beam along the tilted vertical axis, and the tilt. -->
  <line x1="160" y1="200" x2="160" y2="300" stroke="#777777" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="160" y1="212" x2="193" y2="507.3" stroke="#1f6fb2" stroke-width="2.5"/>
  <path d="M160,272 A60,60 0 0 0 166.7,271.6" fill="none" stroke="#444444" stroke-width="1.5"/>
  <text x="168" y="292" font-size="12" fill="#444444">θ</text>

  <!-- The vehicle and its velocity. -->
  <g transform="rotate(-6 160 200)">
    <rect x="136" y="196" width="48" height="8" rx="2" fill="#555555"/>
    <ellipse cx="136" cy="192" rx="14" ry="3" fill="#888888"/>
    <ellipse cx="184" cy="192" rx="14" ry="3" fill="#888888"/>
    <rect x="155" y="204" width="10" height="7" fill="#1f6fb2"/>
  </g>
  <line x1="204" y1="214" x2="243.2" y2="214" stroke="#2f7d32" stroke-width="3"/>
  <polygon points="252,214 241,209 241,219" fill="#2f7d32"/>
  <text x="258" y="219" fill="#2f7d32" font-weight="bold">v = 6 m/s</text>
  <text x="160" y="166" text-anchor="middle" font-weight="bold">Vehicle</text>
  <text x="160" y="181" text-anchor="middle" font-size="12" fill="#444444">30 m altitude</text>

  <!-- The sensors. -->
  <text x="236" y="270" fill="#1f6fb2" font-weight="bold">Range finder</text>
  <text x="236" y="286" font-size="12" fill="#444444">Range r = h / cos θ along the tilted axis,</text>
  <text x="236" y="301" font-size="12" fill="#444444">σ = 5 cm</text>
  <text x="236" y="335" fill="#d9661f" font-weight="bold">Optical flow</text>
  <text x="236" y="351" font-size="12" fill="#444444">Apparent rate of the ground ω = v / r,</text>
  <text x="236" y="366" font-size="12" fill="#444444">σ = 0.01 rad/s</text>

  <!-- The branch in the beam at 50 s. -->
  <rect x="556" y="350" width="8" height="78" fill="#8a6d3b"/>
  <ellipse cx="560" cy="330" rx="28" ry="22" fill="#5a9a4a"/>
  <g transform="rotate(-6 560 200)" opacity="0.4">
    <rect x="536" y="196" width="48" height="8" rx="2" fill="#555555"/>
    <ellipse cx="536" cy="192" rx="14" ry="3" fill="#888888"/>
    <ellipse cx="584" cy="192" rx="14" ry="3" fill="#888888"/>
    <rect x="555" y="204" width="10" height="7" fill="#1f6fb2"/>
  </g>
  <line x1="560" y1="212" x2="572" y2="320" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="572" y1="320" x2="584" y2="425" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="596" y="262" fill="#c0392b" font-weight="bold">Branch, 50 s</text>
  <text x="596" y="278" font-size="12" fill="#444444">A range 8 m short,</text>
  <text x="596" y="293" font-size="12" fill="#444444">rejected</text>

  <text x="700" y="630" text-anchor="end" font-size="11" fill="#666666">Vertical scale and tilt exaggerated.</text>
</svg>
