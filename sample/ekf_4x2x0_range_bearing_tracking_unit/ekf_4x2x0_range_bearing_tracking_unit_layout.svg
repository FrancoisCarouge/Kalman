<?xml version="1.0" encoding="utf-8"?>
<!-- Situational layout of the ekf_4x2x0_range_bearing_tracking_unit sample, top
     view: 1 m = 22 px, x = 330 + 22 x, y = 360 - 22 y. -->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Range Bearing Layout</title>
  <rect x="0" y="0" width="720" height="640" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-weight="bold" font-size="16">Sample 4x2x0 Range Bearing Tracking</text>
  <text x="360" y="52" text-anchor="middle">Situational Layout, Top View</text>

  <!-- The x and y axes of the sensor frame. -->
  <line x1="330" y1="360" x2="551" y2="360" stroke="#2f7d32" stroke-width="2"/>
  <polygon points="560,360 549,365 549,355" fill="#2f7d32"/>
  <text x="566" y="365" fill="#2f7d32" font-weight="bold">x</text>
  <line x1="330" y1="360" x2="330" y2="139" stroke="#2f7d32" stroke-width="2"/>
  <polygon points="330,130 335,141 325,141" fill="#2f7d32"/>
  <text x="330" y="122" text-anchor="middle" fill="#2f7d32" font-weight="bold">y</text>

  <!-- The negative x axis, where the bearing wraps from π to -π. -->
  <line x1="330" y1="360" x2="80" y2="360" stroke="#d9661f" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="90" y="350" fill="#a8460c" font-weight="bold">θ → +π</text>
  <text x="90" y="382" fill="#a8460c" font-weight="bold">θ → -π</text>
  <text x="20" y="500" font-size="12" fill="#a8460c">Crossing it, the measured bearing</text>
  <text x="20" y="515" font-size="12" fill="#a8460c">jumps by 2π: it is unwrapped</text>
  <text x="20" y="530" font-size="12" fill="#a8460c">around the predicted bearing.</text>

  <!-- The circular path of the target, counterclockwise. -->
  <circle cx="330" cy="360" r="176" fill="none" stroke="#4a90c2" stroke-width="3"/>
  <polygon points="269.8,525.4 254.3,527.2 259,514" fill="#4a90c2"/>
  <text x="450" y="560" fill="#1f6fb2" font-weight="bold">Target path: 8 m radius,</text>
  <text x="450" y="578" fill="#1f6fb2" font-weight="bold">0.2 rad/s counterclockwise, 1.6 m/s,</text>
  <text x="450" y="596" font-size="12" fill="#1f6fb2">a turn every 31.4 s, for 100 s</text>

  <!-- The target start, near the negative x axis. -->
  <circle cx="155.8" cy="335.2" r="6" fill="#ffffff" stroke="#1f6fb2" stroke-width="2"/>
  <text x="145.8" y="323.2" text-anchor="end" font-size="12" fill="#1f6fb2">Start, θ = 3 rad</text>

  <!-- One measurement: its bearing and range uncertainty, ±σ. -->
  <path d="M495.5,282.8 A182.6,182.6 0 0 0 434.7,210.4 L427.2,221.2 A169.4,169.4 0 0 1 483.5,288.4 Z" fill="#d9661f" fill-opacity="0.35" stroke="#d9661f" stroke-width="1.5"/>
  <line x1="546" y1="155" x2="453.5" y2="222.8" stroke="#a8460c" stroke-width="1"/>
  <text x="550" y="150" fill="#a8460c" font-weight="bold">One measurement, ±σ:</text>
  <text x="550" y="166" font-size="12" fill="#a8460c">±2.1 m across the line of sight,</text>
  <text x="550" y="181" font-size="12" fill="#a8460c">±0.3 m along it</text>

  <!-- The range and the bearing of the target. -->
  <line x1="330" y1="360" x2="464.8" y2="246.9" stroke="#555555" stroke-width="1.5"/>
  <text x="409.6" y="262.5" text-anchor="end" fill="#333333">range r,</text>
  <text x="409.6" y="278.5" text-anchor="end" fill="#333333">σ = 0.3 m</text>
  <path d="M382,360 A52,52 0 0 0 369.8,326.6" fill="none" stroke="#333333" stroke-width="1.5"/>
  <polygon points="369.8,326.6 378.7,330.9 372.6,336" fill="#333333"/>
  <text x="392" y="348" fill="#333333">bearing θ, σ = 0.26 rad (15°)</text>

  <!-- The target and its velocity. -->
  <line x1="464.8" y1="246.9" x2="432" y2="207.8" stroke="#1f6fb2" stroke-width="2.5"/>
  <polygon points="426.3,200.9 437.2,206.1 429.5,212.5" fill="#1f6fb2"/>
  <circle cx="464.8" cy="246.9" r="8" fill="#1f6fb2" stroke="#ffffff" stroke-width="2"/>
  <text x="448.8" y="251.9" text-anchor="end" fill="#1f6fb2" font-weight="bold">Target</text>

  <!-- The sensor at the origin. -->
  <rect x="321" y="351" width="18" height="18" fill="#d62728"/>
  <text x="316" y="390" text-anchor="end" fill="#d62728" font-weight="bold">Sensor</text>
  <text x="316" y="406" text-anchor="end" font-size="12" fill="#444444">bearing and range,</text>
  <text x="316" y="421" text-anchor="end" font-size="12" fill="#444444">every Δt = 0.1 s</text>
</svg>
