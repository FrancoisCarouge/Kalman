  <text x="40" y="98" fill="#a8460c" font-weight="bold">Guess by eye</text>
  <text x="160" y="114" font-size="12" fill="#a8460c">45 m to 75 m: σ = 15 m,</text>
  <text x="160" y="129" font-size="12" fill="#a8460c">P = 225 m²</text>

  <!-- The observer guessing the height. -->
  <circle cx="90" cy="503" r="9" fill="none" stroke="#222222" stroke-width="2"/>
  <path d="M90,512 L90,538 M90,520 L76,530 M90,520 L104,530 M90,538 L80,558 M90,538 L100,558" stroke="#222222" stroke-width="2" fill="none"/>
