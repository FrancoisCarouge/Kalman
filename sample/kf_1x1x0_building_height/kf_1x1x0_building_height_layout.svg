  <!-- The true height of the building. -->
  <line x1="270" y1="410" x2="270" y2="266.8" stroke="#444444" stroke-width="1.5"/>
  <polygon points="270,260 274,269 266,269" fill="#444444"/>
  <line x1="270" y1="410" x2="270" y2="553.2" stroke="#444444" stroke-width="1.5"/>
  <polygon points="270,560 266,551 274,551" fill="#444444"/>
  <line x1="262" y1="260" x2="300" y2="260" stroke="#444444" stroke-width="1"/>
  <text x="262" y="405" text-anchor="end" font-weight="bold">True height</text>
  <text x="262" y="421" text-anchor="end" font-size="12" fill="#444444">50 m, constant during</text>
  <text x="262" y="436" text-anchor="end" font-size="12" fill="#444444">the measurements</text>

  <!-- The guess of the height by eye, the initial estimate. -->
  <line x1="140" y1="200" x2="560" y2="200" stroke="#d9661f" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="132" y="110" width="16" height="180" fill="#f8dcc8" stroke="#d9661f" stroke-width="1"/>
