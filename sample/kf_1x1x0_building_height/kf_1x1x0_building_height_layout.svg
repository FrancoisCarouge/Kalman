  <text x="90" y="590" text-anchor="middle" font-weight="bold">Observer</text>

  <!-- The altimeter on the roof. -->
  <rect x="352" y="244" width="26" height="16" rx="2" fill="#1f6fb2"/>
  <line x1="365" y1="244" x2="365" y2="230" stroke="#1f6fb2" stroke-width="2"/>
  <text x="440" y="248" fill="#1f6fb2" font-weight="bold">Altimeter</text>
  <text x="440" y="264" font-size="12" fill="#444444">Measured height z, ten measurements:</text>
  <text x="440" y="279" font-size="12" fill="#444444">40.85 m to 55.15 m, σ = 5 m: R = 25 m²</text>
