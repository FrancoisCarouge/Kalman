<?xml version="1.0" encoding="utf-8"?>
<!-- Situational layout of the ekf_104x12x0_global_weather_unit sample. Top: the
     grid on an equirectangular map, x = 360 + 600 λ / 360°, y = 250 - 300 φ /
     180°. Bottom: the state elements of a column, by level. -->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Global Weather Layout</title>
  <rect x="0" y="0" width="720" height="760" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-weight="bold" font-size="16">Sample 104x12x0 Global Weather</text>
  <text x="360" y="52" text-anchor="middle">Situational Layout: the Grid, the Observations, and the Localization</text>

  <!-- The map: the oceans, the parallels, and the meridians of the grid. -->
  <rect x="60" y="100" width="600" height="300" fill="#eaf2fa" stroke="#7f8c99" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="660" y2="250" stroke="#7f8c99" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="652" y="244" text-anchor="end" font-size="12" fill="#55606b">Equator</text>
  <line x1="60" y1="175" x2="660" y2="175" stroke="#b5c2cf" stroke-width="1"/>
  <line x1="60" y1="325" x2="660" y2="325" stroke="#b5c2cf" stroke-width="1"/>
  <line x1="210" y1="100" x2="210" y2="400" stroke="#b5c2cf" stroke-width="1"/>
  <line x1="360" y1="100" x2="360" y2="400" stroke="#b5c2cf" stroke-width="1"/>
  <line x1="510" y1="100" x2="510" y2="400" stroke="#b5c2cf" stroke-width="1"/>
  <text x="42" y="179" text-anchor="end" font-size="12">45°N</text>
  <text x="42" y="329" text-anchor="end" font-size="12">45°S</text>
  <text x="60" y="418" text-anchor="middle" font-size="12">180°</text>
  <text x="210" y="418" text-anchor="middle" font-size="12">90°W</text>
  <text x="360" y="418" text-anchor="middle" font-size="12">0°</text>
  <text x="510" y="418" text-anchor="middle" font-size="12">90°E</text>
  <text x="660" y="418" text-anchor="middle" font-size="12">180°</text>

  <!-- The localization of the sounded column, 90°E 45°N: itself and its two
       neighbouring columns, 60° away; the others are beyond the cutoff. -->
  <rect x="330" y="140" width="345" height="70" rx="30" fill="#d3e3f3" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="502" y="132" text-anchor="middle" font-size="12" fill="#1f6fb2">Correlated with the sounded column: ρ = 1, then 0.4 at 60°</text>
  <text x="210" y="132" text-anchor="middle" font-size="12" fill="#55606b">Beyond the cutoff, 90°: ρ = 0</text>

  <!-- The westerlies of each latitude, carrying the fields eastward. -->
  <g stroke="#2f7d32" stroke-width="2" fill="#2f7d32">
    <line x1="85" y1="200" x2="175" y2="200"/>
    <polygon points="184,200 173,205 173,195" stroke="none"/>
    <line x1="235" y1="200" x2="325" y2="200"/>
    <polygon points="334,200 323,205 323,195" stroke="none"/>
    <line x1="85" y1="350" x2="175" y2="350"/>
    <polygon points="184,350 173,355 173,345" stroke="none"/>
    <line x1="235" y1="350" x2="325" y2="350"/>
    <polygon points="334,350 323,355 323,345" stroke="none"/>
  </g>
  <text x="130" y="220" text-anchor="middle" font-size="12" fill="#2f7d32">Westerlies</text>
  <text x="130" y="370" text-anchor="middle" font-size="12" fill="#2f7d32">Westerlies</text>
  <!-- The meridional exchange across the equator. -->
  <line x1="600" y1="190" x2="600" y2="310" stroke="#2f7d32" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="600,184 605,195 595,195" fill="#2f7d32"/>
  <polygon points="600,316 605,305 595,305" fill="#2f7d32"/>
  <text x="606" y="268" font-size="12" fill="#2f7d32">Across the</text>
  <text x="606" y="282" font-size="12" fill="#2f7d32">equator</text>

  <!-- The eight columns, numbered in state order, the 180° column repeated at
       both edges of the map. -->
  <g stroke="#333333" stroke-width="1.5" fill="#ffffff">
    <circle cx="360" cy="175" r="12"/>
    <circle cx="510" cy="175" r="12"/>
    <circle cx="660" cy="175" r="12"/>
    <circle cx="60" cy="175" r="12" stroke-dasharray="3 2"/>
    <circle cx="210" cy="175" r="12"/>
    <circle cx="360" cy="325" r="12"/>
    <circle cx="510" cy="325" r="12"/>
    <circle cx="660" cy="325" r="12"/>
    <circle cx="60" cy="325" r="12" stroke-dasharray="3 2"/>
    <circle cx="210" cy="325" r="12"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <text x="360" y="179">0</text>
    <text x="510" y="179">1</text>
    <text x="660" y="179">2</text>
    <text x="60" y="179">2</text>
    <text x="210" y="179">3</text>
    <text x="360" y="329">4</text>
    <text x="510" y="329">5</text>
    <text x="660" y="329">6</text>
    <text x="60" y="329">6</text>
    <text x="210" y="329">7</text>
  </g>

  <!-- The observations. A sounding of column 1. -->
  <ellipse cx="530" cy="150" rx="7" ry="9" fill="#1f6fb2"/>
  <line x1="530" y1="159" x2="515" y2="168" stroke="#1f6fb2" stroke-width="1.5"/>
  <!-- The surface pressure stations of columns 0 and 6. -->
  <polygon points="372,198 380,184 388,198" fill="#2a9d4b"/>
  <polygon points="628,348 636,334 644,348" fill="#2a9d4b"/>
  <!-- The satellite retrievals: ozone of column 5, cloud water of column 3. -->
  <g fill="#7b3fa0">
    <rect x="525" y="292" width="10" height="10"/>
    <rect x="513" y="295" width="10" height="4"/>
    <rect x="537" y="295" width="10" height="4"/>
  </g>
  <line x1="530" y1="302" x2="514" y2="316" stroke="#7b3fa0" stroke-width="1.5" stroke-dasharray="3 2"/>
  <g fill="#d9661f">
    <rect x="225" y="142" width="10" height="10"/>
    <rect x="213" y="145" width="10" height="4"/>
    <rect x="237" y="145" width="10" height="4"/>
  </g>
  <line x1="230" y1="152" x2="214" y2="166" stroke="#d9661f" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- The legend of the observations. -->
  <ellipse cx="74" cy="444" rx="6" ry="8" fill="#1f6fb2"/>
  <text x="88" y="449">Sounding: temperature, winds, and humidity of both levels</text>
  <polygon points="66,478 74,464 82,478" fill="#2a9d4b"/>
  <text x="88" y="477">Surface pressure station</text>
  <rect x="69" y="490" width="10" height="10" fill="#7b3fa0"/>
  <text x="88" y="500">Satellite retrieval of the column mean ozone, weighted by layer mass</text>
  <rect x="69" y="514" width="10" height="10" fill="#d9661f"/>
  <text x="88" y="524">Satellite retrieval of the column mean cloud water</text>
  <text x="66" y="550" font-size="12" fill="#55606b">Twelve observations every six hours; the filter predicts every hour, for ten days.</text>

  <!-- A column of the grid: its two levels and its thirteen state elements. -->
  <text x="360" y="586" text-anchor="middle" font-weight="bold">A Column: Thirteen State Elements</text>
  <rect x="150" y="600" width="420" height="44" fill="#f4f7fb" stroke="#7f8c99"/>
  <text x="160" y="627" font-weight="bold">300 hPa</text>
  <text x="250" y="627">Temperature, winds, humidity, ozone, cloud water</text>
  <rect x="150" y="652" width="420" height="44" fill="#f4f7fb" stroke="#7f8c99"/>
  <text x="160" y="679" font-weight="bold">850 hPa</text>
  <text x="250" y="679">Temperature, winds, humidity, ozone, cloud water</text>
  <rect x="150" y="704" width="420" height="10" fill="#c8b48a"/>
  <text x="580" y="714">Surface pressure</text>
  <text x="360" y="742" text-anchor="middle" font-size="12" fill="#55606b">Each element a quantity of its own kind: 8 columns × 13 = 104 states.</text>
</svg>
