name: 'CppCheck'

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install
      run: |
        ( cd /tmp
          git clone --depth 1 'https://github.com/danmar/cppcheck.git'
          cmake -S 'cppcheck' -B 'cppcheck/build'
          cmake --build 'cppcheck/build' --parallel 4
          sudo cmake --install 'cppcheck/build' )
    # cppcheck cannot evaluate the `__has_feature` compiler built-in.
    - name: Verify
      run: |
        cppcheck \
          --check-level=exhaustive \
          --enable=all \
          --error-exitcode=1 \
          --suppress=internalAstError:support/eigen/fcarouge/eigen.hpp \
          --suppress=missingIncludeSystem \
          --suppress=unhandledChar \
          --suppress=unmatchedSuppression \
          --suppress=unusedFunction \
          --verbose \
          -i build \
          -I include \
          -I support/eigen \
          -I support/eigexed \
          -I support/main \
          -I support/mp_units \
          -I support/mp_units_eigen \
          -U__has_feature \
          .
