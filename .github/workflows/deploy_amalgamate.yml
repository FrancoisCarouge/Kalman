name: 'Deploy / Amalgamate'

on:
  workflow_run:
    workflows: ['Deploy / Doxygen']
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Install: Latest CMake'
      uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
    - name: 'Configure'
      run: cmake -S . -B 'build' -D BUILD_TESTING=OFF
    - name: 'Build'
      run: cmake --build 'build' --target amalgamate --verbose
    - name: 'Clean: Depfiles'
      run: rm -f build/amalgamate/fcarouge/*.d
    - name: Deploy
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/amalgamate
        destination_dir: ./amalgamate
