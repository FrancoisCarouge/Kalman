name: 'Deploy / Doxygen'

on:
  push:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Install: Latest CMake'
      uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
    - name: 'Install: Arm GNU Toolchain'
      run: |
        sudo apt update
        sudo apt install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-dev
    # Documents the measured footprint, gated by the freestanding workflow.
    - name: 'Footprint'
      run: |
        cmake -S . -B "${RUNNER_TEMP}/footprint" \
          --toolchain 'support/freestanding/arm_cortex_m4.cmake'
        cmake --build "${RUNNER_TEMP}/footprint" --parallel 4
        ctest --test-dir "${RUNNER_TEMP}/footprint" --parallel 4 || true
        cat "${RUNNER_TEMP}/footprint/footprint.md" \
          "${RUNNER_TEMP}/footprint/benchmark/footprint/row/"*.md \
          > 'documentation/footprint.md'
    - name: Doxygen
      uses: mattnotmitt/doxygen-action@b84fe17600245bb5db3d6c247cc274ea98c15a3b # v1.12
      with:
        working-directory: 'documentation'
        doxyfile-path: 'Doxyfile'
    - name: Deploy
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./documentation/html
