name: 'ClangTidy'

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  "Shard":
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2, 3, 4, 5 ]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Install: Latest CMake'
      uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
    - name: 'Configure'
      env:
        CXX: 'clang++-20'
        CC: 'clang-20'
      run: cmake -S . -B 'build' -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - name: Verify
      run: |
        FILES=$(find . \
          -type f \( \
            -path './benchmark/*.cpp' -o \
            -path './sample/*.cpp' -o \
            -path './support/*.cpp' -o \
            -path './test/*.cpp' \) \
            ! -name '*_fail.cpp' | sort)
        mapfile -t SHARD_FILES < <(echo "$FILES" | awk "NR % ${{ strategy.job-total }} == ${{ strategy.job-index }}")
        run-clang-tidy -j 4 -p 'build' "${SHARD_FILES[@]}"
