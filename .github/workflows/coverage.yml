name: 'Coverage'

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Install: Latest CMake'
      uses: lukka/get-cmake@16e8153a8b4918849d92aad131befe67a3705daa # v4.5.0
    - name: 'Install'
      run: sudo apt update && sudo apt install lcov
    - name: 'Configure'
      env:
        CXX: 'g++-15'
        CXXFLAGS: '-O0 -g --coverage -fno-inline'
        CC: 'gcc-15'
        CCFLAGS: '-O0 -g --coverage -fno-inline'
      run: cmake -S . -B 'build' -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
    - name: 'Build'
      run: cmake --build 'build' --verbose --parallel 4
    - name: 'Coverage: Base'
      run: |
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --capture --initial --directory . --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove base.info '*/benchmark/*' --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove base.info '*/build/*' --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove base.info '*/sample/*' --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove base.info '*/test/*' --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove base.info '/usr/*' --output-file base.info
    - name: 'Test'
      run: ctest --test-dir 'build' --timeout 60 --verbose --parallel 4
    - name: 'Coverage: Test'
      run: |
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --capture --directory . --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove test.info '*/benchmark/*' --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove test.info '*/build/*' --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove test.info '*/sample/*' --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove test.info '*/test/*' --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent,unused --remove test.info '/usr/*' --output-file test.info
    - name: 'Coverage: Results'
      run: |
        echo "${{ github.event.pull_request.number }}" > pull_request_id.txt
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --add-tracefile base.info --add-tracefile test.info --output-file coverage.info | sed -nE 's/^\s+((lines|functions|branches)\.+:)/\1/p' > coverage.txt
    - name: 'Coverage: Artifacts'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-artifact
        path: |
          pull_request_id.txt
          coverage.txt
    - name: 'Coverage: Threshold'
      run: |
        awk '
          /^(lines|functions)\.+:/ {
            found++
            name = $1
            sub(/\.+:$/, "", name)
            hit = substr($3, 2)
            if (hit != $5) {
              printf "::error::Coverage of %s is %s: %s of %s covered, 100%% required.\n", name, $2, hit, $5
              failed = 1
            }
          }
          END {
            if (found != 2) {
              print "::error::The line and function coverage summary is missing."
              exit 1
            }
            exit failed
          }
        ' coverage.txt
