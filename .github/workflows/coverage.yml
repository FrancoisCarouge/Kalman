name: 'Coverage'

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Install: Latest CMake'
      uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
    - name: 'Install'
      run: sudo apt update && sudo apt install lcov
    - name: 'Configure'
      env:
        CXX: 'g++-15'
        CXXFLAGS: '-O0 -g --coverage -fno-inline'
        CC: 'gcc-15'
        CCFLAGS: '-O0 -g --coverage -fno-inline'
      run: cmake -S . -B 'build' -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
    - name: 'Build'
      run: cmake --build 'build' --verbose --parallel 4
    - name: 'Coverage: Base'
      run: |
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --capture --initial --directory . --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --remove base.info '*/build/*' --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --remove base.info '*/sample/*' --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --remove base.info '*/test/*' --output-file base.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --remove base.info '/usr/*' --output-file base.info
    - name: 'Test'
      run: ctest --test-dir 'build' --timeout 60 --verbose --parallel 4
    - name: 'Coverage: Test'
      run: |
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --capture --directory . --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --remove test.info '*/build/*' --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --remove test.info '*/sample/*' --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --remove test.info '*/test/*' --output-file test.info
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --ignore-errors mismatch,inconsistent --remove test.info '/usr/*' --output-file test.info
    - name: 'Coverage: Results'
      run: |
        echo "${{ github.event.pull_request.number }}" > pull_request_id.txt
        lcov --rc branch_coverage=1 --gcov-tool gcov-15 --add-tracefile base.info --add-tracefile test.info --output-file coverage.info | sed -nE 's/^\s+((lines|functions|branches)\.+:)/\1/p' > coverage.txt
    - name: 'Coverage: Artifacts'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-artifact
        path: |
          pull_request_id.txt
          coverage.txt
