name: 'Format'

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit
    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Install'
      run: pipx install cmakefmt
    - name: 'Test'
      run: |
        find . \( \
          -iname '*.hpp' \
          -o -iname '*.cpp' \
          -o -iname '*.tpp' \
          -o -iwholename './support/generator/generator' \) \
          -print0 \
          | xargs -0 \
          clang-format-22 --Werror --dry-run --verbose -style=file
        cmakefmt --check --report-format github .
